[package]
name = "smart-bulk-file-renamer"
version = "1.0.0"
description = "Smart Bulk File Renamer for Windows"
authors = ["Smart Bulk File Renamer Team"]
edition = "2021"

[lib]
name = "smart_bulk_file_renamer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1.11"
once_cell = "1.20"
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3.14"
